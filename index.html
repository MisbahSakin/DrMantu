    <script>
      // In accordance with environment constraints (HMR Disabled), suppress Vite client WebSocket errors
      window.addEventListener('unhandledrejection', function (e) {
        var msg = e && e.reason && (e.reason.message || String(e.reason));
        var stack = e && e.reason && e.reason.stack;
        if (
          (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite-hmr') !== -1)) ||
          (stack && stack.indexOf('@vite/client') !== -1)
        ) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = e && (e.message || String(e));
        var file = e && e.filename;
        if (
          (msg && msg.indexOf('WebSocket') !== -1) ||
          (file && file.indexOf('@vite/client') !== -1)
        ) {
          e.preventDefault();
        }
      });
    </script>
